name: Test Alpaca Stock Data

on:
  workflow_dispatch:

jobs:
  test-alpaca:
    runs-on: ubuntu-latest

    steps:
      - name: Get NVDA price
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

        run: |
          curl --fail --silent --show-error \
            -H "APCA-API-KEY-ID: $ALPACA_API_KEY" \
            -H "APCA-API-SECRET-KEY: $ALPACA_API_SECRET" \
            "https://data.alpaca.markets/v2/stocks/trades/latest?symbols=NVDA&feed=iex" \
            > quote.json

      - name: Build Discord message
        run: |
          python - <<'PY'
          import json

          with open("quote.json") as f:
              data = json.load(f)

          trade = data["trades"]["NVDA"]

          price = trade["p"]
          timestamp = trade["t"]

          payload = {
              "content": (
                  "📈 **Alpaca API Test Successful**\n"
                  f"**NVDA:** ${price:.2f}\n"
                  "Feed: IEX\n"
                  f"Timestamp: {timestamp}"
              )
          }

          with open("discord_payload.json", "w") as f:
              json.dump(payload, f)
          PY

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "User-Agent: StockAIBot/1.0" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK_URL"
